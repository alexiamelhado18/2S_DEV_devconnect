<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Aléxia e Eduardo">
    <meta name="description" content="Site da empresa DevConnect">

    <title>Tela Cadastro - DevConnect</title>

    <link rel="shortcut icon" href="../assets/images/logo-devconnect-sm.svg" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/cadastro.css">
</head>

<body>
    <h1>Tela Cadastro - DevConnect</h1>
    <main>
        <div>
            <!-- formulario -->
            <form class="estilo-formulario">
                <img src="../assets/images/logo-devconnect-lg.svg" alt="Logo DevConnect">

                <div class="formulario-campos">
                    <label for="nome-completo">Nome completo:</label>
                    <input type="text" name="" id="nome-completo">
                </div>

                <div class="formulario-campos">
                    <label for="nome-de-usuario">Nome de usuário:</label>
                    <input type="text" name="" id="nome-de-usuario">
                </div>

                <div class="formulario-campos">
                    <label for="nome-de-usuario">E-mail:</label>
                    <input type="email" name="" id="nome-de-usuario">
                </div>

                <div class="formulario-campos">
                    <label for="senha">Senha:</label>
                    <input type="password" name="" id="senha">
                </div>

                <div class="formulario-campos">
                    <label for="campo-upload" id="texto-upload">Faça upload da sua imagem aqui....</label>
                    <input type="file" name="" id="campo-upload">
                </div>

                <button type="submit" class="formulario-botao-azul">Cadastrar-se</button>

                <p>
                    <span>Ao se cadastrar</span>, você concorda com nossos Termos, Política de Dados e Política de
                    Cookies.
                </p>
            </form>

            <section id="secao-login" class="estilo-formulario">
                <p>Tem uma conta? <a href="index.html">Conecte-se</a></p>
            </section>

            <p>Obtenha o aplicativo</p>

            <section id="secao-instalacao">
                <img src="../assets/images/app-store.svg" alt="Imagem falando da instalação no App Store">

                <img src="../assets/images/google-play.svg" alt="Imagem falando da instalação no Play Store">
            </section>
        </div>
    </main>
</body>

</html>
