<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConnect - Cadastro Usuário</title>

    <link rel="icon" type="image/x-icon" href="../imagens/logo-devconnect-sm.svg">

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/cadastro-usuario.css">
</head>

<body>
    <h1>Tela cadastro de usuário - DevConnect</h1>
    <main>
        <div id="">
            <form action="" method="post" class="formulario__cadastro">
                <img src="../imagens/logo-devconnect-lg.svg" alt="">
                <div>
                    <label for="">Nome completo:</label>
                    <input type="text" name="" id="">
                </div>
                <div>
                    <label for="">Nome de usuário:</label>
                    <input type="text" name="" id="">
                </div>
                <div>
                    <label for="">E-mail:</label>
                    <input type="email" name="" id="">
                </div>
                <div>
                    <label for="">Senha:</label>
                    <input type="password" name="" id="">
                </div>
                <label for="formulario__file" class="formulario__botao botao__cinza">Faça upload da sua imagem
                    aqui....</label>
                <input type="file" id="formulario__file">
                <button class="formulario__botao botao__azul" type="submit">Cadastra-se</button>
                <p>Ao se cadastrar, você concorda com nossos Termos, Política de Dados e Política de Cookies. </p>
            </form>

            <div>
                <p>Tem uma conta? <a href="index.html">Conecte-se</a></p>
            </div>
        </div>

    </main>
</body>

</html>
