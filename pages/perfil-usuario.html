<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConnect - Feed</title>

    <link rel="icon" type="image/x-icon" href="../imagens/logo-devconnect-sm.svg">

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/perfil-usuario.css">
</head>

<body>
    <h1>Tela Feed - DevConnect</h1>

    <header id="cabecalho">
        <div class="cabecalho__alinhamento container">
            <img id="logo__desktop" src="../imagens/logo-devconnect-md.svg"
                alt="Logo DevConnect para dispositivos desktop">
            <img id="logo__mobile" src="../imagens/logo-devconnect-sm.svg"
                alt="Logo DevConnect para dispositivos movéis">

            <nav class="menu">
                <a class="menu__link" href="index.html" title="Ínicio">
                    <img src="../imagens/icone-casa-azul.svg" alt="Ícone de uma casa">
                </a>
                <a class="menu__link" href="#" title="Curtidas">
                    <img src="../imagens/icone-coracao-azul.svg" alt="Ícone de um coração">
                </a>
                <a href="#" title="Ver perfil">
                    <div id="avatar"></div>
                </a>
            </nav>
        </div>

    </header>

    <main>
        <section id="perfil__informacoes">
            <div>
                <img id="perfil__foto" src="../imagens/IMG_0481.JPG" alt="">
                <div>
                    <span class="perfil__nome">yes_baby</span>
                    <div class="">
                        <p>3 publicações</p>
                        <p>128 seguindo</p>
                        <p>214 seguidores</p>
                    </div>
                    <div class="perfil__acoes">
                        <span>Marcos Jeeves</span>
                        <nav>
                            <a href="">Editar perfil</a>
                            <a href="#">Sair</a>
                        </nav>

                    </div>
                </div>
            </div>
            <hr />
            <div>
                <img src="../imagens/icone-galeria-preto.svg" alt="Ícone de uma galeria de fotos.">
                <h2>Publicações</h2>
            </div>
        </section>
        <section id="perfil__publicacoes"></section>
    </main>
</body>

</html>
